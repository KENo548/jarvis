# =============================================================================
# JARVIS Falco Rules — Container Runtime Security
# =============================================================================
# Custom rules for monitoring JARVIS container behavior.
# Place this file at: infrastructure/falco-rules/jarvis-rules.yaml
# =============================================================================

- rule: Unexpected Network Connection from Container
  desc: Detect containers making unexpected outbound connections
  condition: >
    evt.type=connect and
    container and
    container.name startswith "jarvis-" and
    not proc.name in (python, node, java, curl, wget) and
    not fd.sip in (172.20.0.0/16, 127.0.0.1)
  output: >
    Unexpected outbound connection from JARVIS container
    (container=%container.name connection=%fd.name proc=%proc.name
    command=%proc.cmdline connection=%fd.rip)
  priority: WARNING
  tags: [network, container, jarvis]

- rule: Container Spawned Shell
  desc: Detect shell execution inside JARVIS containers
  condition: >
    evt.type=execve and
    container and
    container.name startswith "jarvis-" and
    proc.name in (bash, sh, zsh, fish, powershell, pwsh) and
    not proc.pname in (bash, sh, zsh, fish)
  output: >
    Shell spawned in JARVIS container
    (container=%container.name parent=%proc.pname shell=%proc.name
    command=%proc.cmdline user=%user.name)
  priority: NOTICE
  tags: [execution, container, jarvis]

- rule: Sensitive File Access in Container
  desc: Detect access to sensitive files inside JARVIS containers
  condition: >
    evt.type=open and
    container and
    container.name startswith "jarvis-" and
    (fd.name startswith /etc/shadow or
     fd.name startswith /etc/passwd or
     fd.name contains .env or
     fd.name contains id_rsa or
     fd.name contains .pem or
     fd.name contains vault-keys)
  output: >
    Sensitive file accessed in JARVIS container
    (container=%container.name file=%fd.name proc=%proc.name
    command=%proc.cmdline flags=%evt.arg.flags)
  priority: WARNING
  tags: [file, container, jarvis, credential]

- rule: Unexpected Container Port Exposure
  desc: Detect JARVIS containers exposing unexpected ports
  condition: >
    evt.type=bind and
    container and
    container.name startswith "jarvis-" and
    not fd.sport in (8000, 5678, 9090, 3000, 3100, 8201, 8888, 7233, 8233, 5060, 8099)
  output: >
    Unexpected port binding in JARVIS container
    (container=%container.name port=%fd.sport proc=%proc.name
    command=%proc.cmdline)
  priority: WARNING
  tags: [network, container, jarvis]

- rule: Container Process Tampering
  desc: Detect process injection or ptrace attempts in JARVIS containers
  condition: >
    (evt.type=ptrace or evt.type=process_vm_writev) and
    container and
    container.name startswith "jarvis-"
  output: >
    Process tampering detected in JARVIS container
    (container=%container.name proc=%proc.name target=%proc.tid
    command=%proc.cmdline flags=%evt.arg.request)
  priority: CRITICAL
  tags: [process, container, jarvis, tampering]

- rule: Vault Token Exfiltration Attempt
  desc: Detect attempts to read or exfiltrate Vault tokens
  condition: >
    evt.type=open and
    container and
    container.name startswith "jarvis-" and
    (fd.name contains vault-root-token or
     fd.name contains .vault-keys or
     fd.name contains VAULT_TOKEN) and
    not proc.name in (python, vault)
  output: >
    Vault token access attempt in container
    (container=%container.name file=%fd.name proc=%proc.name
    command=%proc.cmdline user=%user.name)
  priority: CRITICAL
  tags: [credential, container, jarvis, vault]

- rule: Excessive API Rate from Container
  desc: Detect containers making excessive API calls (possible runaway agent)
  condition: >
    evt.type=connect and
    container and
    container.name startswith "jarvis-" and
    fd.rip != 172.20.0.0/16
  output: >
    API call from JARVIS container
    (container=%container.name dest=%fd.rip proc=%proc.name)
  priority: INFO
  rate: 10/60
  tags: [network, container, jarvis, rate-limit]
