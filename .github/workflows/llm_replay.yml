name: LLM Replay Canary

on:
  push:
    branches: [ master ]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests
      - name: Run canonical tasks (mock)
        run: |
          python -u jarvis/tests/run_canonical_tasks.py
